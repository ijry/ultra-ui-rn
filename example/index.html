<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ultra-ui-rn Example</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
      @font-face {
        font-family: 'uicon-iconfont';
        src: url('/fonts/uicon-iconfont.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
    if (typeof global === 'undefined') { window.global = window; }
    if (typeof process === 'undefined') { window.process = { env: {}, browser: true }; }
    if (typeof Buffer === 'undefined') { window.Buffer = { isBuffer: function() { return false; } }; }
    </script>
    <script type="module" src="/web-main.tsx"></script>
  </body>
</html>
