name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm pack --dry-run
      - run: git diff --check
